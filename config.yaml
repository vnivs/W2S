env:
  training_sizes:
    - [10, 5]
  batch_size: 40
  max_ops_per_job: 6

data_gen:
  ops_per_job_min: 5
  ops_per_job_max: 6
  machines_per_op_min: 1
  machines_per_op_max: 3
  proc_time_min: 1
  proc_time_max: 100
  proc_time_std: 0.6

network:
  in_size_ope: 7
  in_size_ma: 5
  pair_private_dim: 9
  out_size_ope: 64
  out_size_ma: 64
  hidden_size: 128
  num_hgnn_layers: 2
  num_heads: 1
  actor_hidden_dim: 128
  actor_num_layers: 2
  dropout: 0
  pair_attn_layers: 2

optim:
  lr: 2.0e-4
  entropy_coef: 0.06
  max_grad_norm: 2

ppo:
  clip_eps: 0.2
  value_coef: 0.5
  gamma: 1.0
  gae_lambda: 0.98
  ppo_epochs: 2

timing:
  hidden_dim: 64
  use_candidate_self_attention: true

training:
  num_iterations: 1000
  data_refresh_interval: 10
  log_interval: 1
  eval_interval: 1
  test_data_dir: 'instances/song'
  val_subdir: '1005'
  save_dir: 'checkpoints'
  save_best: true
  save_interval: 0
  device: 'auto'
  use_proc_time_aug: true

experiment:
  seed: 42
